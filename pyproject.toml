[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "py-dss-toolkit"
version = "0.12.0"
description = "Advanced Python Tools for OpenDSS Powered by EPRI."
readme = "README.md"
license = "MIT"
authors = [
  {name = "Paulo Radatz", email = "paulo.radatz@gmail.com"}
]
requires-python = ">=3.10"
keywords = ["OpenDSS", "Python", "Power Systems", "Distribution Systems", "Energy"]
dependencies = [
	"py-dss-interface>=2.3.0",
	"pandas>=2.2",
	"matplotlib>=3.10",
	"plotly>=5.20",
	"networkx>=3.0"
]

classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering",
  "Topic :: Software Development :: Libraries :: Python Modules"
]

[project.urls]
"Changelog" = "https://github.com/PauloRadatz/py_dss_toolkit/blob/master/CHANGELOG.rst"
"Issue Tracker" = "https://github.com/PauloRadatz/py_dss_toolkit/issues"
"Source" = "https://github.com/PauloRadatz/py_dss_toolkit"

[tool.setuptools]
packages = { find = {where = ["src"]} }

